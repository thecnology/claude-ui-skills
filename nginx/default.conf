server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Prototyp se často mění – ať prohlížeč vždy vidí aktuální verzi.
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache";
    }
}
